# BusyBox man(1) — pre-rendered ASCII under cat7/ (no nroff in guest).
# Pages: /usr/share/man/cat7/IR0-*.7  →  man IR0-boot | man IR0-uspace | …
MANPATH /usr/share/man
# Prefer preformatted cat pages (BusyBox man walks MANPATH/catN/).
CATPATH /usr/share/man
# `more` is safer than `less` on IR0 until less is fully solid (poll/F_SETFL).
DEFINE pager more
